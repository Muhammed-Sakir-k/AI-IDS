<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-IDS // Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="scanline"></div>

<div class="login-wrap">
    <div class="login-logo">
        <div class="shield"><i class="fa-solid fa-circle-nodes"></i></div>
        <h1>Sentinel<span>AI</span></h1>
        <p>Threat Intelligence Platform</p>
    </div>

    <div class="login-card">
        <div class="login-title">Admin Authentication</div>

        {% if error %}
        <div class="error-banner">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label>Username</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username"
                           placeholder="Enter username"
                           autocomplete="username" required>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password"
                           placeholder="Enter password"
                           autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>
        </form>
    </div>

    <div class="login-footer">
        AI-IDS © 2026 · Authorized Personnel Only
    </div>
</div>
</body>
</html>
